name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Typecheck, generated-artifact checks, package builds and the fast Node-side client tests.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:client
      - name: Validate generated OpenAPI 3.1 and required operation metadata
        run: npm run openapi:lint
      - name: Generated typed client is current
        run: node scripts/generate-client.mjs --check
      - name: Published packages build and pack
        run: |
          npm run build -w kofra
          npm pack -w kofra --dry-run
          npm pack -w @dropway/core --dry-run
          npm pack -w @dropway/server --dry-run
          npm pack -w @dropway/client --dry-run

  # The slow suites of `npm test`, run in parallel instead of one after another: the
  # Workers-runtime tests (D1, R2, KV emulated) and the CLI and browser-code tests, which
  # drive Chromium through Playwright against a local Worker.
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # Allow slow browser dependency downloads plus the suite itself.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: workers
            script: test:workers
          - suite: cli
            script: test:cli
            browser: true
          - suite: browser-code
            script: test:browser-code
            browser: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/cli/test/encrypted/package-lock.json
      - run: npm ci
      - if: matrix.browser
        run: npm ci --prefix packages/cli/test/encrypted
      - if: matrix.browser
        run: packages/cli/test/encrypted/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run ${{ matrix.script }}

  # This repository is the single-tenant open-source product. Fails on any sign of the
  # hosted service's code: payment SDKs, private packages or markers, billing/pricing code.
  # Also fails while user-visible names from before the rename remain (fix: npm run rebrand).
  open-core-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Guard rules catch planted examples
        run: node scripts/guard-open-core.mjs --self-test
      - name: Open-core guard
        run: node scripts/guard-open-core.mjs
      - name: Rebrand script passes its self-test
        run: node scripts/rebrand.mjs --self-test
      - name: No user-visible names from before the rename (fix with npm run rebrand)
        run: node scripts/rebrand.mjs --check

  # The published CLI promises Node 20+. Build the bundle and run it on Node 20.
  cli-node20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w kofra
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Run the bundle on Node 20
        run: |
          node --version
          node packages/cli/dist/dropway.mjs --version
          node packages/cli/dist/dropway.mjs --help > /dev/null
          node packages/cli/dist/dropway.mjs publish packages/cli/src --dry-run --json > /tmp/dry.json
          node -e 'const r = JSON.parse(require("fs").readFileSync("/tmp/dry.json", "utf8")); if (!r.ok || !r.files.length) process.exit(1); console.log("dry run ok: " + r.files.length + " files")'

  # Single stable check name for the default-branch ruleset to require. Fails unless every
  # job above succeeded (a failed, cancelled or skipped dependency all count as failure).
  ci-ok:
    if: always()
    needs: [check, test, open-core-guard, cli-node20]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a required CI job did not succeed ($r)"; exit 1; }
          done
