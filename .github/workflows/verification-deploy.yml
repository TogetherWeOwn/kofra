# Verification deploy: release-checklist environment on Cloudflare.
#
# Manual dispatch only. Deploys wrangler.verification.jsonc (Worker
# `kofra-verification`, dedicated D1/KV/R2 names) to the Cloudflare account
# behind the `verification` GitHub environment secrets — never the root
# wrangler.jsonc. There is no separate Cloudflare test account: the hosted
# Kofra (`dropway*` Workers) lives in the same account, so isolation is by
# resource names only (`kofra-verification*`, teardown by explicit name).
# The token is therefore account-wide by necessity, and this workflow must
# never run wrangler against any other name — the guard step below fails
# the job before any wrangler call if the config does not declare exactly
# the `kofra-verification*` names. This is the environment
# docs/RELEASE_CHECKLIST.md is run against; it is disposable and holds no
# user data.
#
# Operator one-time setup (GitHub: Settings > Environments > verification):
#   CLOUDFLARE_API_TOKEN   Account-scoped, short-lived (3 h): Workers
#                          Scripts, D1, Workers KV Storage and Workers R2
#                          Storage write access.
#   CLOUDFLARE_ACCOUNT_ID  That account's ID. Stored as an environment
#                          secret so both values live behind the same gate.
#   ADMIN_BOOTSTRAP_KEY    The app bootstrap key for first setup (at least
#                          32 characters), minted by the operator. This
#                          repository is public, so the key must never be
#                          written to a workflow artifact, log or summary:
#                          public-repo artifacts are downloadable by any
#                          signed-in GitHub user, and this instance sits on
#                          a public workers.dev URL. The checklist runner
#                          receives the same value out of band (operator-
#                          provisioned secret), never from this workflow.
# Before creating those secrets, restrict the `verification` environment's
# deployment branches to `main` and add a required reviewer so each
# dispatch waits for an approval before it proceeds: masking protects
# logs, not against a modified workflow dispatched from another branch.
# Mint ADMIN_BOOTSTRAP_KEY randomly (e.g.
# `openssl rand -hex 32`, stored with no surrounding whitespace); the
# workflow's length/padding check enforces the app's 32-character minimum
# as the app applies it (after trimming), not entropy.
# The app's SIGNING_SECRET is generated per run inside the job, put on the
# Worker as a secret, and never leaves the job. ADMIN_BOOTSTRAP_KEY is
# read from the environment secret above and likewise only ever passed to
# `wrangler secret put` over stdin (masked in logs).
#
# Teardown (action=teardown) deletes the Worker, D1 database and KV
# namespace, then tries the R2 bucket. R2 refuses to delete a non-empty
# bucket and wrangler has no bulk object delete, so a leftover bucket is
# reported in the step summary for a one-click dashboard empty+delete.
name: verification-deploy
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Deploy the verification environment, or tear it down"
        type: choice
        options: [deploy, teardown]
        default: deploy
        required: true
permissions:
  contents: read
concurrency:
  group: verification-deploy
  cancel-in-progress: false
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: verification
    # Cloudflare credentials are deliberately NOT job-level env: they are set
    # only on the steps that call wrangler (and the step that checks they
    # exist), so other steps never run with the verification account token
    # in their environment. Dependency lifecycle scripts do not run at all
    # (`npm ci --ignore-scripts` below), so an install script can neither see
    # the token nor replace the wrangler this job later calls with it;
    # wrangler/esbuild ship their binaries as platform packages and deploy
    # fine without them (verified with `wrangler deploy --dry-run`).
    env:
      WRANGLER_CONFIG: wrangler.verification.jsonc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The token is account-wide (no separate test account) and the hosted
      # Kofra shares that account, so fail before any wrangler call unless
      # the config addresses exactly the kofra-verification* resources.
      - name: Guard — config targets only kofra-verification resources
        run: |
          if [ "$WRANGLER_CONFIG" != "wrangler.verification.jsonc" ]; then
            echo "::error::WRANGLER_CONFIG is '$WRANGLER_CONFIG', expected wrangler.verification.jsonc. Refusing to run."
            exit 1
          fi
          # Escaped keys (e.g. "name" spelled with a \uXXXX escape) decode to a
          # real key for wrangler's JSONC parser but are invisible to the
          # greps below, and block comments could hide a fake name line, so
          # this config (which needs neither) refuses both outright.
          if grep -qF '\' "$WRANGLER_CONFIG" || grep -qF '/*' "$WRANGLER_CONFIG"; then
            echo "::error::$WRANGLER_CONFIG contains a backslash escape or block comment; the verification config must stay plain JSONC so the guard sees every key wrangler sees. Refusing to run."
            exit 1
          fi
          # Exactly-once checks: a first-match grep alone would let a comment
          # or a second binding smuggle another resource name past the guard.
          # Raw key counts too: an extracted match plus a second literal key
          # the extraction pattern cannot see (split across lines, or with a
          # comment between key and colon) must also refuse.
          for key in '"name"' '"database_name"' '"bucket_name"'; do
            count="$(grep -oF "$key" "$WRANGLER_CONFIG" | wc -l | tr -d ' ' || true)"
            if [ "$count" -ne 1 ]; then
              echo "::error::$WRANGLER_CONFIG must contain the key $key exactly once (found $count). Refusing to run."
              exit 1
            fi
          done
          names="$(grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]*"' "$WRANGLER_CONFIG" | sed -E 's/.*"([^"]*)"$/\1/' || true)"
          if [ "$names" != "kofra-verification" ]; then
            echo "::error::$WRANGLER_CONFIG must declare Worker name 'kofra-verification' exactly once (found: $(echo "$names" | tr '\n' ' ')). Refusing to run wrangler against any other name."
            exit 1
          fi
          dbs="$(grep -oE '"database_name"[[:space:]]*:[[:space:]]*"[^"]*"' "$WRANGLER_CONFIG" | sed -E 's/.*"([^"]*)"$/\1/' || true)"
          if [ "$dbs" != "kofra-verification" ]; then
            echo "::error::$WRANGLER_CONFIG must declare D1 database_name 'kofra-verification' exactly once (found: $(echo "$dbs" | tr '\n' ' ')). Refusing to run."
            exit 1
          fi
          buckets="$(grep -oE '"bucket_name"[[:space:]]*:[[:space:]]*"[^"]*"' "$WRANGLER_CONFIG" | sed -E 's/.*"([^"]*)"$/\1/' || true)"
          if [ "$buckets" != "kofra-verification-files" ]; then
            echo "::error::$WRANGLER_CONFIG must declare R2 bucket_name 'kofra-verification-files' exactly once (found: $(echo "$buckets" | tr '\n' ' ')). Refusing to run."
            exit 1
          fi
          # ID-addressed resources would bypass the name checks above. Any
          # literal occurrence refuses (no colon pattern: a key split across
          # lines must not slip past either).
          if grep -qE '"(database_id|preview_database_id|id|preview_id)"' "$WRANGLER_CONFIG"; then
            echo "::error::$WRANGLER_CONFIG addresses a resource by ID (database_id / id / preview_id); verification resources must be addressed by the kofra-verification* names only. Refusing to run."
            exit 1
          fi
          echo "Guard ok: $WRANGLER_CONFIG targets kofra-verification (Worker, D1) and kofra-verification-files (R2)."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Environment secrets are set
        env:
          ACTION: ${{ inputs.action }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The bootstrap key is injected only on deploy; teardown never
          # needs it, so no step in a teardown run holds the value.
          ADMIN_BOOTSTRAP_KEY: ${{ inputs.action == 'deploy' && secrets.ADMIN_BOOTSTRAP_KEY || '' }}
        run: |
          # Mask the bootstrap key before anything could echo it, and never
          # print its value (only presence/length failures are reported).
          if [ -n "${ADMIN_BOOTSTRAP_KEY:-}" ]; then
            echo "::add-mask::$ADMIN_BOOTSTRAP_KEY"
          fi
          missing=0
          required="CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID"
          # Teardown needs no app secrets; only a deploy sets them.
          if [ "$ACTION" = "deploy" ]; then
            required="$required ADMIN_BOOTSTRAP_KEY"
          fi
          for name in $required; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Environment secret $name is not set on the 'verification' environment (see workflow header)."
              missing=1
            fi
          done
          if [ "$ACTION" = "deploy" ] && [ -n "${ADMIN_BOOTSTRAP_KEY:-}" ] && [ "${#ADMIN_BOOTSTRAP_KEY}" -lt 32 ]; then
            echo "::error::Environment secret ADMIN_BOOTSTRAP_KEY is shorter than the app's 32-character minimum (see workflow header); the instance would refuse it."
            missing=1
          fi
          # The app trims the key before applying that minimum
          # (packages/core/src/config.ts), so a padded value could pass the
          # raw length check above yet be refused by the deployed Worker.
          if [ "$ACTION" = "deploy" ] && [ -n "${ADMIN_BOOTSTRAP_KEY:-}" ] && [[ "$ADMIN_BOOTSTRAP_KEY" =~ ^[[:space:]] || "$ADMIN_BOOTSTRAP_KEY" =~ [[:space:]]$ ]]; then
            echo "::error::Environment secret ADMIN_BOOTSTRAP_KEY has leading or trailing whitespace; the app trims it before the 32-character check. Re-create the secret without padding (see workflow header)."
            missing=1
          fi
          exit "$missing"
      # Same guard as after checkout, repeated inline on purpose: it re-runs
      # after `npm ci`, so a config rewritten between checkout and deploy is
      # still refused before any wrangler call, and the check itself comes
      # from the workflow definition, not from a workspace file. Keep the
      # two copies in sync.
      - name: Guard (re-check after npm ci) — config targets only kofra-verification resources
        run: |
          if [ "$WRANGLER_CONFIG" != "wrangler.verification.jsonc" ]; then
            echo "::error::WRANGLER_CONFIG is '$WRANGLER_CONFIG', expected wrangler.verification.jsonc. Refusing to run."
            exit 1
          fi
          # Escaped keys (e.g. "name" spelled with a \uXXXX escape) decode to a
          # real key for wrangler's JSONC parser but are invisible to the
          # greps below, and block comments could hide a fake name line, so
          # this config (which needs neither) refuses both outright.
          if grep -qF '\' "$WRANGLER_CONFIG" || grep -qF '/*' "$WRANGLER_CONFIG"; then
            echo "::error::$WRANGLER_CONFIG contains a backslash escape or block comment; the verification config must stay plain JSONC so the guard sees every key wrangler sees. Refusing to run."
            exit 1
          fi
          # Exactly-once checks: a first-match grep alone would let a comment
          # or a second binding smuggle another resource name past the guard.
          # Raw key counts too: an extracted match plus a second literal key
          # the extraction pattern cannot see (split across lines, or with a
          # comment between key and colon) must also refuse.
          for key in '"name"' '"database_name"' '"bucket_name"'; do
            count="$(grep -oF "$key" "$WRANGLER_CONFIG" | wc -l | tr -d ' ' || true)"
            if [ "$count" -ne 1 ]; then
              echo "::error::$WRANGLER_CONFIG must contain the key $key exactly once (found $count). Refusing to run."
              exit 1
            fi
          done
          names="$(grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]*"' "$WRANGLER_CONFIG" | sed -E 's/.*"([^"]*)"$/\1/' || true)"
          if [ "$names" != "kofra-verification" ]; then
            echo "::error::$WRANGLER_CONFIG must declare Worker name 'kofra-verification' exactly once (found: $(echo "$names" | tr '\n' ' ')). Refusing to run wrangler against any other name."
            exit 1
          fi
          dbs="$(grep -oE '"database_name"[[:space:]]*:[[:space:]]*"[^"]*"' "$WRANGLER_CONFIG" | sed -E 's/.*"([^"]*)"$/\1/' || true)"
          if [ "$dbs" != "kofra-verification" ]; then
            echo "::error::$WRANGLER_CONFIG must declare D1 database_name 'kofra-verification' exactly once (found: $(echo "$dbs" | tr '\n' ' ')). Refusing to run."
            exit 1
          fi
          buckets="$(grep -oE '"bucket_name"[[:space:]]*:[[:space:]]*"[^"]*"' "$WRANGLER_CONFIG" | sed -E 's/.*"([^"]*)"$/\1/' || true)"
          if [ "$buckets" != "kofra-verification-files" ]; then
            echo "::error::$WRANGLER_CONFIG must declare R2 bucket_name 'kofra-verification-files' exactly once (found: $(echo "$buckets" | tr '\n' ' ')). Refusing to run."
            exit 1
          fi
          # ID-addressed resources would bypass the name checks above. Any
          # literal occurrence refuses (no colon pattern: a key split across
          # lines must not slip past either).
          if grep -qE '"(database_id|preview_database_id|id|preview_id)"' "$WRANGLER_CONFIG"; then
            echo "::error::$WRANGLER_CONFIG addresses a resource by ID (database_id / id / preview_id); verification resources must be addressed by the kofra-verification* names only. Refusing to run."
            exit 1
          fi
          echo "Guard ok: $WRANGLER_CONFIG targets kofra-verification (Worker, D1) and kofra-verification-files (R2)."
      - name: Generate per-run signing secret
        if: inputs.action == 'deploy'
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/verification"
          printf '%s' "$(openssl rand -hex 32)" > "$RUNNER_TEMP/verification/signing-secret"
          echo "::add-mask::$(cat "$RUNNER_TEMP/verification/signing-secret")"
      # Same sequence as root `npm run deploy`, pinned to the verification
      # config: migrations first, deploy first instead while the database
      # does not exist yet (first deploy provisions D1/R2/KV), then
      # migrations again and a final deploy on the migrated schema.
      - name: Deploy verification Worker
        if: inputs.action == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler d1 migrations apply DB --remote -c "$WRANGLER_CONFIG" \
            || npx wrangler deploy -c "$WRANGLER_CONFIG"
          npx wrangler d1 migrations apply DB --remote -c "$WRANGLER_CONFIG"
          npx wrangler deploy -c "$WRANGLER_CONFIG" | tee "$RUNNER_TEMP/verification/deploy.log"
          url="$(grep -oE 'https://kofra-verification\.[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/verification/deploy.log" | head -n 1)"
          if [ -z "$url" ]; then
            echo "::error::Could not read the workers.dev URL from the wrangler deploy output."
            exit 1
          fi
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"
          echo "Deployed: $url"
      - name: Set Worker secrets
        if: inputs.action == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_BOOTSTRAP_KEY: ${{ secrets.ADMIN_BOOTSTRAP_KEY }}
        run: |
          set -o pipefail
          echo "::add-mask::$ADMIN_BOOTSTRAP_KEY"
          # Pass the bootstrap key over stdin only; it is never written to
          # disk, an artifact, the step summary or a log line.
          printf '%s' "$ADMIN_BOOTSTRAP_KEY" | npx wrangler secret put ADMIN_BOOTSTRAP_KEY -c "$WRANGLER_CONFIG"
          npx wrangler secret put SIGNING_SECRET -c "$WRANGLER_CONFIG" < "$RUNNER_TEMP/verification/signing-secret"
          rm -f "$RUNNER_TEMP/verification/signing-secret"
      - name: Smoke the deployed instance
        if: inputs.action == 'deploy'
        run: |
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS "$WORKER_URL/health" | grep -q '"ok":true'; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::GET $WORKER_URL/health did not return ok:true within 150s of the deploy."
            exit 1
          fi
          curl -fsS "$WORKER_URL/openapi.json" | head -c 400 | grep -q '"openapi":"3.1' \
            || { echo "::error::GET $WORKER_URL/openapi.json did not return an OpenAPI 3.1 document."; exit 1; }
          {
            echo "## Verification environment deployed"
            echo "- Instance URL: $WORKER_URL"
            echo "- Git SHA: $GITHUB_SHA"
            echo "- Next: run docs/RELEASE_CHECKLIST.md against the instance URL **from Part A step 4 onward** (see its verification-instance variant: steps 1–3 are substituted by this deploy and recorded as a deviation — do not run the Deploy button or the root config in this shared account), using the bootstrap key from the operator-provisioned secret (the same value as the \`verification\` environment's ADMIN_BOOTSTRAP_KEY secret — it is never published by this workflow), then dispatch action=teardown."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Tear down verification environment
        if: inputs.action == 'teardown'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler delete -c "$WRANGLER_CONFIG" --force
          npx wrangler d1 delete kofra-verification -c "$WRANGLER_CONFIG" -y
          # Delete KV by namespace title, not --binding: the committed config
          # carries no KV id (the first deploy auto-provisions it under
          # wrangler's <script>-<binding-lowercase> title), so --binding has
          # nothing to resolve from this fresh checkout — and the Worker
          # whose settings could resolve it was just deleted above.
          npx wrangler kv namespace delete kofra-verification-cache -c "$WRANGLER_CONFIG" -y
          if npx wrangler r2 bucket delete kofra-verification-files; then
            echo "Worker, D1, KV and R2 bucket deleted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::R2 bucket kofra-verification-files was not deleted (non-empty buckets cannot be deleted and wrangler has no bulk object delete). Empty and delete that bucket (by that exact name) in the Cloudflare dashboard. Worker, D1 and KV are deleted."
            echo "Worker, D1 and KV deleted. R2 bucket \`kofra-verification-files\` still exists (non-empty): empty and delete that bucket (by that exact name) in the Cloudflare dashboard." >> "$GITHUB_STEP_SUMMARY"
          fi
